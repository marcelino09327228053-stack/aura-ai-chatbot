<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MB Future Tech — AI Chatbot | Team</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e5e7eb;font:15px Arial;padding:28px}.wrap{max-width:960px;margin:auto}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:22px;margin:18px 0}input,select,button,.btn{padding:10px 13px;border:0;border-radius:8px;font:inherit}input,select{background:#0f172a;color:white;border:1px solid #475569}.btn,button{background:#7c3aed;color:white;font-weight:bold;cursor:pointer;text-decoration:none}.danger{background:#b91c1c}.member,.activity{padding:13px 0;border-bottom:1px solid #334155}.muted{color:#94a3b8}.invite{display:flex;gap:8px;flex-wrap:wrap}.invite input{flex:1;min-width:230px}@media(max-width:650px){.top,.row{align-items:flex-start;flex-direction:column}}
</style><script src="/static/aura-notifications.js"></script>
</head><body><main class="wrap"><div class="top"><div><h1>Team Management</h1><p class="muted">Invite users and control their company access.</p></div><a class="btn" href="/dashboard">Dashboard</a></div>
<section class="card"><h2>Invite existing AI Chatbot user</h2><div class="invite"><input id="email" type="email" placeholder="teammate@example.com"><select id="inviteRole"><option value="member">Member</option><option value="admin">Admin</option><option value="viewer">Viewer</option></select><button onclick="invite()">Invite</button></div><p id="status" class="muted"></p></section>
<section class="card"><h2>Members</h2><div id="members">Loading…</div></section><section class="card"><h2>Recent activity</h2><div id="activity">Loading…</div></section>
</main><script>
function headers(){const t=localStorage.getItem("aura_token");if(!t){location.href="/login";return null}const h={"Content-Type":"application/json",Authorization:"Bearer "+t};const c=localStorage.getItem("aura_company_id");if(c)h["X-Company-Id"]=c;return h}function esc(v){const d=document.createElement("div");d.textContent=v||"";return d.innerHTML}
async function load(){const [tr,ar]=await Promise.all([fetch("/api/infrastructure/team",{headers:headers()}),fetch("/api/infrastructure/activity",{headers:headers()})]);if(tr.status===401)return location.href="/login";const data=await tr.json();members.innerHTML=data.members.map(x=>`<div class="member row"><div><b>User #${x.user_id}</b><div class="muted">Joined ${esc(x.created_at)}</div></div><div>${x.role==="owner"?'<b>Owner</b>':`<select onchange="setRole(${x.user_id},this.value)"><option ${x.role==="admin"?"selected":""}>admin</option><option value="member" ${x.role==="member"?"selected":""}>member</option><option value="viewer" ${x.role==="viewer"?"selected":""}>viewer</option></select> <button class="danger" onclick="removeMember(${x.user_id})">Remove</button>`}</div></div>`).join("");const acts=await ar.json();activity.innerHTML=acts.length?acts.map(x=>`<div class="activity"><b>${esc(x.action)}</b> <span class="muted">${esc(x.details)} · ${esc(x.created_at)}</span></div>`).join(""):'<p class="muted">No activity yet.</p>'}
async function invite(){const r=await fetch("/api/infrastructure/team/invite",{method:"POST",headers:headers(),body:JSON.stringify({email:email.value,role:inviteRole.value})});const d=await r.json();status.textContent=r.ok?"Member added.":d.detail||"Invite failed.";if(r.ok){email.value="";load()}}
async function setRole(id,role){const r=await fetch("/api/infrastructure/team/"+id+"/role",{method:"PUT",headers:headers(),body:JSON.stringify({role})});if(!r.ok)showToast((await r.json()).detail||"Update failed.");load()}
async function removeMember(id){const r=await fetch("/api/infrastructure/team/"+id,{method:"DELETE",headers:headers()});if(!r.ok){showToast((await r.json()).detail||"Remove failed.");return}showToast("Team member removed.");load()}
load();
</script></body></html>
