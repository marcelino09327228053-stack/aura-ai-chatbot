<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB Future Tech Owner Console</title>
<style>.provider-mark{background:#f4f7f6!important;border:1px solid #ffffff24;box-shadow:inset 0 0 0 1px #07120f12}.provider-mark img{display:block;width:27px;height:27px;object-fit:contain}.provider-mark span{display:none;color:#10251e}</style>
<style>body{margin:0;padding:24px;background:#07120f;color:#effff8;font:15px Arial}.wrap{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#10251e;border:1px solid #285844;border-radius:15px;padding:18px;margin-bottom:14px}button,input,select{padding:10px;border-radius:8px;border:1px solid #356b55;background:#091a14;color:white}button{background:#45d49a;color:#062218;font-weight:bold;cursor:pointer}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.metric{font-size:28px;font-weight:bold}.muted{color:#9cc5b3}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #285844;text-align:left}#app{display:none}.provider-section{padding:22px;background:linear-gradient(145deg,#10251e,#0b1d17)}.section-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}.section-heading h2{margin:0 0 6px}.security-note{display:flex;align-items:center;gap:8px;padding:8px 11px;border:1px solid #285844;border-radius:99px;color:#a9d4c1;background:#0a1a14;font-size:13px;white-space:nowrap}.security-dot{width:8px;height:8px;border-radius:50%;background:#55e5aa;box-shadow:0 0 0 4px #55e5aa18}.provider-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}.provider-card{position:relative;overflow:hidden;padding:18px;border:1px solid #285844;border-radius:15px;background:#0a1b15;transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease}.provider-card:hover{transform:translateY(-2px);border-color:#3b8063;box-shadow:0 14px 30px #0004}.provider-card:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--provider-accent,#55e5aa)}.provider-head{display:flex;align-items:center;gap:12px;margin-bottom:17px}.provider-mark{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;border-radius:12px;background:var(--provider-soft,#173c2e);color:var(--provider-accent,#55e5aa);font-size:18px;font-weight:800}.provider-name{font-size:17px;font-weight:750;text-transform:capitalize}.provider-state{margin-left:auto;display:flex;align-items:center;gap:7px;padding:6px 9px;border-radius:99px;background:#15382b;color:#7bf0bc;font-size:12px;font-weight:700}.provider-state.offline{background:#3b2522;color:#ffb4a9}.provider-state.cooldown{background:#3b321c;color:#ffd77a}.state-dot{width:7px;height:7px;border-radius:50%;background:currentColor}.key-label{display:flex;justify-content:space-between;gap:8px;margin-bottom:7px;color:#a9d4c1;font-size:13px}.key-suffix{color:#72e0b2;font-family:Consolas,monospace}.key-box{display:flex;align-items:center;gap:8px;padding:5px 5px 5px 12px;border:1px solid #2c5c48;border-radius:11px;background:#071510}.key-box:focus-within{border-color:#55e5aa;box-shadow:0 0 0 3px #55e5aa18}.key-box input{min-width:0;flex:1;padding:8px 0;border:0;outline:0;background:transparent}.provider-actions{display:flex;gap:8px;margin-top:13px}.provider-actions button{flex:1}.btn-secondary{background:#132d23;color:#bce6d3;border-color:#31654f}.btn-secondary:hover{background:#193b2e}.save-status{min-height:18px;margin-top:10px;color:#7bf0bc;font-size:13px}.activity-list{display:grid;gap:10px}.activity{display:flex;align-items:center;gap:13px;padding:12px 14px;background:#0b1d16;border:1px solid #214c3a;border-radius:12px}.activity-icon{display:grid;place-items:center;width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:#173c2e;color:#55e5aa;font-weight:bold}.activity-main{min-width:0;flex:1}.activity-title{font-weight:700;margin-bottom:4px}.activity-meta{color:#9cc5b3;font-size:13px}.activity-badge{padding:5px 9px;border-radius:99px;background:#15382b;color:#7bf0bc;font-size:12px;font-weight:bold}.empty{text-align:center;padding:28px;color:#9cc5b3}@media(max-width:600px){body{padding:14px}.section-heading{display:block}.security-note{display:inline-flex;margin-top:12px}.provider-grid{grid-template-columns:1fr}.activity{align-items:flex-start}.activity-badge{display:none}}</style></head><body><main class="wrap">
<section id="login" class="card" style="max-width:430px;margin:10vh auto"><h1>Owner Console</h1><p class="muted">Private administration access</p><div class="row"><input id="email" type="email" autocomplete="username" placeholder="Owner email" style="flex:1"></div><div class="row"><input id="password" type="password" autocomplete="current-password" placeholder="Owner password" style="flex:1"></div><div id="mfa-row" class="row"><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit MFA code" maxlength="6" style="flex:1"></div><div class="row"><button onclick="login()" style="width:100%">Login</button></div><p id="error" style="color:#fb7185"></p></section>
<section id="app"><div class="row" style="justify-content:space-between"><h1>MB Future Tech Owner Console</h1><button onclick="logout()">Logout</button></div><div id="overview" class="grid"></div>
<div class="card provider-section"><div class="section-heading"><div><h2>AI Gateway Providers</h2><div class="muted">Connect and monitor your authorized AI services.</div></div><div class="security-note"><span class="security-dot"></span>Keys encrypted on this server</div></div><div id="providers" class="provider-grid"></div></div>
<div class="card"><h2>Agents</h2><div id="agents"></div></div>
<div class="card"><h2>Subscribers</h2><div style="overflow:auto"><table><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th>Allowance</th><th>Used</th><th>Cycle end</th></tr></thead><tbody id="subs"></tbody></table></div></div>
<div class="card"><h2>Recent audit activity</h2><p class="muted">Security and administration history</p><div id="audit" class="activity-list"></div></div></section></main><script>
async function api(url,opt={}){opt.headers={'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
api('/owner/auth-config').then(c=>{if(!c.mfa_required)document.getElementById('mfa-row').style.display='none'});
function escapeHtml(value){return String(value??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function activityDetails(action){const parts=String(action||'').split(':');const name=parts[0];if(name==='owner.login')return ['Owner signed in','Secure console access','↪'];if(name==='owner.provider.updated')return [`${parts[1]||'AI'} connection updated`,'Provider credentials changed','✓'];if(name==='owner.provider.tested')return [`${parts[1]||'AI'} connection tested`,'Provider connectivity check','✓'];if(name==='owner.provider.deleted')return [`${parts[1]||'AI'} connection removed`,'Provider credentials deleted','−'];if(name.startsWith('owner.agent.'))return [`${name.replace('owner.agent.','')} agent ${parts[1]==='True'||parts[1]==='true'?'enabled':'disabled'}`,'Agent control updated','◆'];return [name.replaceAll('.',' ').replaceAll('_',' '),'System activity','•']}
function renderAudit(items){if(!items.length){audit.innerHTML='<div class="empty">No activity recorded yet.</div>';return}audit.innerHTML=items.map(item=>{const [title,detail,icon]=activityDetails(item.action);const when=item.created_at?new Date(item.created_at.replace(' ','T')+'Z').toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'Time unavailable';return `<div class="activity"><div class="activity-icon">${escapeHtml(icon)}</div><div class="activity-main"><div class="activity-title">${escapeHtml(title)}</div><div class="activity-meta">${escapeHtml(detail)} · ${escapeHtml(when)}</div></div><span class="activity-badge">Recorded</span></div>`}).join('')}
function renderProviders(health,savedItems){const saved=Object.fromEntries(savedItems.map(p=>[p.provider,p]));const styles={openai:['OA','#8be9c7','#173a30'],gemini:['G','#9ec5ff','#182d45'],claude:['C','#ffbd91','#43291c'],groq:['GQ','#ff9fa9','#432127']};providers.innerHTML=Object.keys(health).map(p=>{const connected=Boolean(saved[p]);const state=health[p]?.state||'healthy';const stateClass=state==='healthy'?(connected?'':'offline'):'cooldown';const stateText=!connected?'Not connected':state.replaceAll('_',' ');const style=styles[p]||[p.slice(0,2).toUpperCase(),'#8be9c7','#173a30'];return `<article class="provider-card" style="--provider-accent:${style[1]};--provider-soft:${style[2]}"><div class="provider-head"><div class="provider-mark">${escapeHtml(style[0])}</div><div><div class="provider-name">${escapeHtml(p)}</div><div class="muted">Server-managed connection</div></div><div class="provider-state ${stateClass}"><span class="state-dot"></span>${escapeHtml(stateText)}</div></div><label class="key-label" for="key-${escapeHtml(p)}"><span>Secret API key</span><span class="key-suffix">${connected?'Saved ·•••• '+escapeHtml(saved[p].key_suffix):'No key saved'}</span></label><div class="key-box"><input id="key-${escapeHtml(p)}" type="password" autocomplete="new-password" placeholder="Paste a new API key"><button class="btn-secondary" type="button" onclick="toggleKey('${escapeHtml(p)}')" aria-label="Show or hide key">Show</button></div><div class="provider-actions"><button type="button" onclick="saveKey('${escapeHtml(p)}')">Save connection</button><button class="btn-secondary" type="button" onclick="testKey('${escapeHtml(p)}')">Test connection</button></div><div id="status-${escapeHtml(p)}" class="save-status"></div></article>`}).join('')}
const renderProviderCards=renderProviders;
renderProviders=function(health,savedItems){renderProviderCards(health,savedItems);const logos={openai:['openai','OpenAI'],gemini:['gemini-color','Google Gemini'],claude:['claude-color','Claude'],deepseek:['deepseek-color','DeepSeek'],grok:['grok','Grok'],groq:['groq','Groq']};document.querySelectorAll('.provider-card').forEach(card=>{const provider=card.querySelector('.provider-name').textContent.trim().toLowerCase(),mark=card.querySelector('.provider-mark'),logo=logos[provider];if(!logo)return;const fallback=mark.textContent;mark.innerHTML=`<img src="https://unpkg.com/@lobehub/icons-static-svg@latest/icons/${logo[0]}.svg" alt="${logo[1]} logo" loading="lazy"><span>${escapeHtml(fallback)}</span>`;mark.querySelector('img').addEventListener('error',e=>{e.currentTarget.style.display='none';mark.querySelector('span').style.display='block'})})}
function toggleKey(p){const input=document.getElementById('key-'+p);const button=input.nextElementSibling;input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'Show':'Hide'}
async function login(){try{await api('/owner/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,code:code.value})});document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}catch(e){error.textContent=e.message}}
async function logout(){await api('/owner/logout',{method:'POST'});location.reload()}
async function load(){try{const d=await api('/owner/dashboard');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';overview.innerHTML=Object.entries(d.overview).map(([k,v])=>`<div class="card"><div class="muted">${k.replaceAll('_',' ')}</div><div class="metric">${v}</div></div>`).join('');renderProviders(d.provider_health,d.providers);agents.innerHTML=d.agents.map(a=>`<label class="row"><input type="checkbox" ${a.enabled!==false?'checked':''} onchange="setAgent('${a.agent_type}',this.checked)">${a.agent_type}</label>`).join('');subs.innerHTML=d.subscribers.map(s=>`<tr><td>${s.company_name}</td><td>${s.plan}</td><td>${s.status}</td><td>₱${(s.monthly_ai_allowance_minor/100).toFixed(2)}</td><td>₱${(s.ai_usage_consumed_minor/100).toFixed(2)}</td><td>${s.billing_cycle_end||'—'}</td></tr>`).join('');renderAudit(d.audit);return true}catch(e){return false}}
async function saveKey(p){const input=document.getElementById('key-'+p),status=document.getElementById('status-'+p);if(!input.value.trim()){status.textContent='Enter an API key first.';return}status.textContent='Saving securely…';try{await api('/owner/providers/'+p,{method:'POST',body:JSON.stringify({api_key:input.value})});input.value='';await load()}catch(e){status.textContent=e.message}}
async function testKey(p){if(!confirm('This sends a small billable provider request. Continue?'))return;const status=document.getElementById('status-'+p);status.textContent='Testing connection…';try{const result=await api('/owner/providers/'+p+'/test',{method:'POST',body:JSON.stringify({confirm_billable:true})});status.textContent=`Connection successful · ${result.input_tokens+result.output_tokens} tokens used`}catch(e){status.textContent=e.message}}
async function setAgent(a,e){await api('/owner/agents/'+a,{method:'PUT',body:JSON.stringify({enabled:e})});load()}
load();
</script></body></html>
