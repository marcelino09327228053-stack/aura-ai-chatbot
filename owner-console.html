<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB Future Tech Owner Console</title>
<style>body{margin:0;padding:24px;background:#07120f;color:#effff8;font:15px Arial}.wrap{max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#10251e;border:1px solid #285844;border-radius:15px;padding:18px;margin-bottom:14px}button,input,select{padding:10px;border-radius:8px;border:1px solid #356b55;background:#091a14;color:white}button{background:#45d49a;color:#062218;font-weight:bold;cursor:pointer}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.metric{font-size:28px;font-weight:bold}.muted{color:#9cc5b3}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #285844;text-align:left}#app{display:none}</style></head><body><main class="wrap">
<section id="login" class="card" style="max-width:430px;margin:10vh auto"><h1>Owner Console</h1><p class="muted">Private administration access</p><div class="row"><input id="email" type="email" autocomplete="username" placeholder="Owner email" style="flex:1"></div><div class="row"><input id="password" type="password" autocomplete="current-password" placeholder="Owner password" style="flex:1"></div><div class="row"><input id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit MFA code" maxlength="6" style="flex:1"><button onclick="login()">Login</button></div><p id="error" style="color:#fb7185"></p></section>
<section id="app"><div class="row" style="justify-content:space-between"><h1>MB Future Tech Owner Console</h1><button onclick="logout()">Logout</button></div><div id="overview" class="grid"></div>
<div class="card"><h2>AI Gateway Providers</h2><p class="muted">Keys are encrypted and the full saved value is never returned.</p><div id="providers"></div></div>
<div class="card"><h2>Agents</h2><div id="agents"></div></div>
<div class="card"><h2>Subscribers</h2><div style="overflow:auto"><table><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th>Allowance</th><th>Used</th><th>Cycle end</th></tr></thead><tbody id="subs"></tbody></table></div></div>
<div class="card"><h2>Recent audit activity</h2><pre id="audit"></pre></div></section></main><script>
async function api(url,opt={}){opt.headers={'Content-Type':'application/json'};const r=await fetch(url,opt);const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}
async function login(){try{await api('/owner/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value,code:code.value})});document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}catch(e){error.textContent=e.message}}
async function logout(){await api('/owner/logout',{method:'POST'});location.reload()}
async function load(){try{const d=await api('/owner/dashboard');document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';overview.innerHTML=Object.entries(d.overview).map(([k,v])=>`<div class="card"><div class="muted">${k.replaceAll('_',' ')}</div><div class="metric">${v}</div></div>`).join('');const saved=Object.fromEntries(d.providers.map(p=>[p.provider,p]));providers.innerHTML=Object.keys(d.provider_health).map(p=>`<div class="row"><b style="width:100px">${p}</b><span>${saved[p]?'••••'+saved[p].key_suffix:'Not connected'}</span><input id="key-${p}" type="password" placeholder="New API key"><button onclick="saveKey('${p}')">Save</button><button onclick="testKey('${p}')">Test</button></div>`).join('');agents.innerHTML=d.agents.map(a=>`<label class="row"><input type="checkbox" ${a.enabled!==false?'checked':''} onchange="setAgent('${a.agent_type}',this.checked)">${a.agent_type}</label>`).join('');subs.innerHTML=d.subscribers.map(s=>`<tr><td>${s.company_name}</td><td>${s.plan}</td><td>${s.status}</td><td>₱${(s.monthly_ai_allowance_minor/100).toFixed(2)}</td><td>₱${(s.ai_usage_consumed_minor/100).toFixed(2)}</td><td>${s.billing_cycle_end||'—'}</td></tr>`).join('');audit.textContent=JSON.stringify(d.audit,null,2);return true}catch(e){return false}}
async function saveKey(p){const input=document.getElementById('key-'+p);await api('/owner/providers/'+p,{method:'POST',body:JSON.stringify({api_key:input.value})});input.value='';load()}
async function testKey(p){if(!confirm('This sends a small billable provider request. Continue?'))return;alert(JSON.stringify(await api('/owner/providers/'+p+'/test',{method:'POST',body:JSON.stringify({confirm_billable:true})})))}
async function setAgent(a,e){await api('/owner/agents/'+a,{method:'PUT',body:JSON.stringify({enabled:e})});load()}
load();
</script></body></html>
