name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/run_all_tests.py
      - run: python -m compileall -q app tests scripts main.py owner_main.py
      - run: pip check

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aura
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aura -d aura_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      AURA_ENV: development
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://aura:ci-only-password@127.0.0.1:5432/aura_test
      REDIS_ENABLED: "false"
      SECRET_KEY: ci-secret-key-that-is-at-least-32-bytes
      AGENTS_ENABLED: "false"
      PLUGINS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/postgres_smoke.py
