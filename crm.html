<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MB Future Tech — AI Chatbot | CRM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e5e7eb;font:15px Arial;padding:28px}.wrap{max-width:1100px;margin:auto}.top,.row,.form{display:flex;justify-content:space-between;align-items:center;gap:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#1e293b;border:1px solid #334155;border-radius:14px;padding:20px;margin:18px 0}input,select,textarea,button,.btn{padding:10px;border:0;border-radius:8px;font:inherit}input,select,textarea{background:#0f172a;color:white;border:1px solid #475569}.form{flex-wrap:wrap}.form input{flex:1;min-width:140px}.btn,button{background:#7c3aed;color:white;font-weight:bold;cursor:pointer;text-decoration:none}.danger{background:#b91c1c}.item{padding:12px 0;border-bottom:1px solid #334155}.muted{color:#94a3b8}@media(max-width:760px){.grid{grid-template-columns:1fr}.top,.row{align-items:flex-start;flex-direction:column}}</style><script src="/static/aura-notifications.js"></script>
</head>
<body><main class="wrap"><div class="top"><div><h1>Customer CRM</h1><p class="muted">Customers, leads, notes, and contact history.</p></div><a class="btn" href="/dashboard">Dashboard</a></div>
<section class="card"><h2>Add customer</h2><div class="form"><input id="name" placeholder="Customer name"><input id="email" type="email" placeholder="Email"><input id="phone" placeholder="Phone"><button onclick="addCustomer()">Add</button></div><p id="status" class="muted"></p></section>
<div class="grid"><section class="card"><h2>Customers</h2><div id="customers"></div></section><section class="card"><h2>Leads</h2><div class="form"><input id="leadName" placeholder="Lead name"><input id="leadSource" placeholder="Source"><button onclick="addLead()">Add lead</button></div><div id="leads"></div></section></div>
<section class="card"><h2>Customer notes and history</h2><select id="customerSelect" onchange="loadDetails()"></select><div class="form" style="margin-top:12px"><input id="note" placeholder="Add internal note"><button onclick="addNote()">Save note</button><input id="contactSummary" placeholder="Contact summary"><select id="channel"><option>widget</option><option>email</option><option>phone</option><option>facebook</option><option>whatsapp</option></select><button onclick="addContact()">Add contact</button></div><div class="grid"><div><h3>Notes</h3><div id="notes"></div></div><div><h3>Contact history</h3><div id="history"></div></div></div></section>
</main><script>
function headers(){const t=localStorage.getItem("aura_token");if(!t){location.href="/login";return null}const h={"Content-Type":"application/json",Authorization:"Bearer "+t};const c=localStorage.getItem("aura_company_id");if(c)h["X-Company-Id"]=c;return h}function esc(v){const d=document.createElement("div");d.textContent=v||"";return d.innerHTML}async function api(path,options={}){options.headers=headers();const r=await fetch(path,options);const d=await r.json();if(!r.ok)throw new Error(d.detail||"Request failed.");return d}
async function load(){const [cs,ls]=await Promise.all([api("/crm/customers"),api("/crm/leads")]);customers.innerHTML=cs.length?cs.map(x=>`<div class="item row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.email)} ${esc(x.phone)}</div></div><button class="danger" onclick="removeCustomer(${x.id})">Delete</button></div>`).join(""):'<p class="muted">No customers yet.</p>';customerSelect.innerHTML='<option value="">Choose customer</option>'+cs.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");leads.innerHTML=ls.length?ls.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="muted">${esc(x.status)} · ${esc(x.source)}</div></div>`).join(""):'<p class="muted">No leads yet.</p>'}
async function addCustomer(){try{await api("/crm/customers",{method:"POST",body:JSON.stringify({name:name.value,email:email.value,phone:phone.value})});name.value=email.value=phone.value="";status.textContent="Customer added.";load()}catch(e){status.textContent=e.message}}
async function removeCustomer(id){await api("/crm/customers/"+id,{method:"DELETE"});showToast("Customer deleted.");load()}
async function addLead(){await api("/crm/leads",{method:"POST",body:JSON.stringify({name:leadName.value,source:leadSource.value,status:"new"})});leadName.value=leadSource.value="";load()}
async function loadDetails(){const id=customerSelect.value;if(!id){notes.innerHTML=history.innerHTML="";return}const [ns,hs]=await Promise.all([api("/crm/notes?customer_id="+id),api("/crm/contact-history?customer_id="+id)]);notes.innerHTML=ns.map(x=>`<div class="item">${esc(x.body)}<div class="muted">${esc(x.created_at)}</div></div>`).join("")||'<p class="muted">No notes.</p>';history.innerHTML=hs.map(x=>`<div class="item"><b>${esc(x.channel)}</b> ${esc(x.summary)}<div class="muted">${esc(x.created_at)}</div></div>`).join("")||'<p class="muted">No history.</p>'}
async function addNote(){const id=+customerSelect.value;if(!id||!note.value.trim())return;await api("/crm/notes",{method:"POST",body:JSON.stringify({customer_id:id,body:note.value})});note.value="";loadDetails()}
async function addContact(){const id=+customerSelect.value;if(!id||!contactSummary.value.trim())return;await api("/crm/contact-history",{method:"POST",body:JSON.stringify({customer_id:id,channel:channel.value,summary:contactSummary.value})});contactSummary.value="";loadDetails()}load();
</script></body></html>
