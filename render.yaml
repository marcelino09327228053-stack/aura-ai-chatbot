services:
  - type: web
    name: mb-future-tech-portfolio
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AURA_ENV
        value: staging
      - key: DB_BACKEND
        value: sqlite
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mb-future-tech-portfolio-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUD_ENCRYPTION_KEY
        generateValue: true
      - key: MOCK_PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_WEBHOOK_PROVIDER
        value: portfolio-disabled
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: FORCE_HTTPS
        value: "true"
      - key: AGENTS_ENABLED
        value: "true"
      - key: PLUGINS_ENABLED
        value: "false"
      # Managed AI Gateway. Provider secrets stay in Render; they are never
      # committed to Git. At least one provider key must be configured.
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5.4-mini
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: AI_GATEWAY_PROVIDER_ORDER
        value: gemini,openai,groq,claude
      # Portfolio/demo only. Set to "true" before accepting paid customers.
      - key: AI_GATEWAY_ENFORCE_SUBSCRIPTION
        value: "false"
      - key: AI_GATEWAY_DEMO_DAILY_REQUEST_LIMIT
        value: "20"
      - key: FACEBOOK_AI_PROVIDERS
        value: gemini,openai,groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      # Standard text-token prices verified for the deployment's default
      # models on 2026-09-18. Override this catalog when provider prices change.
      - key: AI_MODEL_COSTS_USD_JSON
        value: '{"gemini-3.6-flash":{"input_per_million":0.75,"output_per_million":3.75},"gpt-5.4-mini":{"input_per_million":0.75,"output_per_million":4.5},"claude-sonnet-5":{"input_per_million":2.0,"output_per_million":10.0},"openai/gpt-oss-120b":{"input_per_million":0.15,"output_per_million":0.60}}'

      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: FACEBOOK_VERIFY_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_OAUTH_REDIRECT_URI
        value: https://mb-future-tech-portfolio.onrender.com/webhooks/facebook/oauth/callback
      - key: FACEBOOK_GRAPH_API_VERSION
        value: v23.0
      - key: FACEBOOK_LANGUAGE
        value: english

  - type: keyvalue
    name: mb-future-tech-portfolio-cache
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
