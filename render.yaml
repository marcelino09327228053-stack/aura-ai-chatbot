services:
  - type: web
    name: mb-future-tech-portfolio
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: AURA_ENV
        value: staging
      - key: DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: mb-future-tech-portfolio-db
          property: connectionString
      - key: REDIS_ENABLED
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: mb-future-tech-portfolio-cache
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CLOUD_ENCRYPTION_KEY
        generateValue: true
      - key: MOCK_PAYMENTS_ENABLED
        value: "false"
      - key: PAYMENT_WEBHOOK_PROVIDER
        value: portfolio-disabled
      - key: ALLOWED_HOSTS
        value: "*.onrender.com"
      - key: FORCE_HTTPS
        value: "true"
      - key: AGENTS_ENABLED
        value: "true"
      - key: PLUGINS_ENABLED
        value: "false"

  - type: keyvalue
    name: mb-future-tech-portfolio-cache
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

databases:
  - name: mb-future-tech-portfolio-db
    plan: free
    region: singapore
    databaseName: mb_future_tech
    user: mb_future_tech
    ipAllowList: []
