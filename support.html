<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MB Future Tech — AI Chatbot | Support Inbox</title><style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e5e7eb;font:14px Arial}.top{height:72px;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334155}.btn,button,input,select{border:0;border-radius:8px;padding:10px;font:inherit}.btn,button{background:#7c3aed;color:white;font-weight:bold;cursor:pointer;text-decoration:none}.layout{display:grid;grid-template-columns:330px 1fr;height:calc(100vh - 72px)}.inbox{border-right:1px solid #334155;overflow:auto}.filters{padding:12px}.conversation{padding:15px;border-bottom:1px solid #334155;cursor:pointer}.conversation:hover,.conversation.active{background:#1e293b}.muted{color:#94a3b8}.chat{display:flex;flex-direction:column;min-width:0}.toolbar{padding:12px;border-bottom:1px solid #334155;display:flex;gap:8px;flex-wrap:wrap}.messages{flex:1;overflow:auto;padding:20px}.msg{max-width:75%;padding:11px 13px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.user{background:#334155}.assistant{background:#6d28d9;margin-left:auto}.reply{display:flex;gap:8px;padding:14px;border-top:1px solid #334155}.reply input{flex:1;background:#1e293b;color:white}.empty{margin:auto;color:#94a3b8}
@media(max-width:750px){.layout{grid-template-columns:1fr}.inbox{height:35vh;border-right:0;border-bottom:1px solid #334155}.chat{height:65vh}}
</style></head><body>
<header class="top"><div><b style="font-size:22px">Support Inbox</b><div class="muted">AI and human conversations</div></div><a class="btn" href="/dashboard">Dashboard</a></header>
<main class="layout"><aside class="inbox"><div class="filters"><select id="filter" onchange="loadInbox()"><option value="">All conversations</option><option>open</option><option>pending</option><option>closed</option></select></div><div id="list"></div></aside>
<section class="chat"><div id="toolbar" class="toolbar" style="display:none"><select id="mode" onchange="updateConversation()"><option value="ai">AI mode</option><option value="human">Human takeover</option></select><select id="conversationStatus" onchange="updateConversation()"><option>open</option><option>pending</option><option>closed</option></select><input id="customerName" placeholder="Customer name" onchange="updateConversation()"><input id="customerEmail" placeholder="Customer email" onchange="updateConversation()"></div><div id="messages" class="messages"><div class="empty">Select a conversation.</div></div><form class="reply" onsubmit="reply(event)"><input id="replyText" placeholder="Write a human reply…" disabled><button id="send" disabled>Send</button></form></section></main>
<script>
let selected=null,selectedMeta=null;function headers(){const t=localStorage.getItem("aura_token");if(!t){location.href="/login";return null}const h={"Content-Type":"application/json",Authorization:"Bearer "+t};const c=localStorage.getItem("aura_company_id");if(c)h["X-Company-Id"]=c;return h}function esc(v){const d=document.createElement("div");d.textContent=v||"";return d.innerHTML}
async function loadInbox(){const q=filter.value?"?status="+filter.value:"";const r=await fetch("/conversations/support/inbox"+q,{headers:headers()});if(r.status===401)return location.href="/login";const rows=await r.json();list.innerHTML=rows.length?rows.map(x=>`<div class="conversation ${x.session_id===selected?"active":""}" onclick='openConversation(${JSON.stringify(x.session_id)},${JSON.stringify(x)})'><b>${esc(x.customer_name||x.last_message||"New conversation")}</b><div class="muted">${esc(x.mode)} · ${esc(x.status)} · ${x.message_count} messages</div></div>`).join(""):'<div class="conversation muted">No support conversations yet. Widget conversations will appear here.</div>'}
async function openConversation(id,meta){selected=id;selectedMeta=meta;toolbar.style.display="flex";mode.value=meta.mode;conversationStatus.value=meta.status;customerName.value=meta.customer_name||"";customerEmail.value=meta.customer_email||"";replyText.disabled=false;send.disabled=false;const r=await fetch("/conversations/"+encodeURIComponent(id),{headers:headers()});const data=await r.json();messages.innerHTML=data.messages.map(x=>`<div class="msg ${x.role==="user"?"user":"assistant"}">${esc(x.content)}<div class="muted">${esc(x.created_at)}</div></div>`).join("");messages.scrollTop=messages.scrollHeight;loadInbox()}
async function updateConversation(){if(!selected)return;const r=await fetch("/conversations/"+encodeURIComponent(selected)+"/support",{method:"PATCH",headers:headers(),body:JSON.stringify({mode:mode.value,status:conversationStatus.value,customer_name:customerName.value,customer_email:customerEmail.value||null})});if(r.ok)selectedMeta=await r.json();loadInbox()}
async function reply(e){e.preventDefault();const text=replyText.value.trim();if(!selected||!text)return;const r=await fetch("/conversations/"+encodeURIComponent(selected)+"/reply",{method:"POST",headers:headers(),body:JSON.stringify({text})});if(r.ok){replyText.value="";openConversation(selected,selectedMeta)}}
loadInbox();setInterval(loadInbox,15000);
</script></body></html>
