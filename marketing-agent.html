<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Agent — MB Future Tech</title>
<style>
:root{--ink:#f6fff9;--muted:#9eb3a8;--line:rgba(214,255,230,.14);--glass:rgba(12,25,20,.72);--glass-2:rgba(26,43,34,.68);--lime:#c9f65b;--mint:#57e5a8;--amber:#ffb85c;--shadow:0 28px 80px rgba(0,0,0,.42)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;min-height:100vh;color:var(--ink);font:16px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#07100c;overflow-x:hidden}body:before,body:after{content:"";position:fixed;pointer-events:none;z-index:-1;border-radius:50%;filter:blur(18px)}body:before{width:70vw;height:70vw;left:-25vw;top:-32vw;background:radial-gradient(circle,rgba(97,216,142,.24),transparent 66%)}body:after{width:72vw;height:72vw;right:-26vw;bottom:-42vw;background:radial-gradient(circle,rgba(217,163,70,.18),transparent 64%)}
.app-shell{display:grid;grid-template-columns:84px minmax(0,1fr);min-height:100vh}.rail{position:fixed;inset:0 auto 0 0;width:84px;display:flex;flex-direction:column;align-items:center;padding:22px 0;border-right:1px solid var(--line);background:rgba(5,13,9,.72);backdrop-filter:blur(22px);z-index:4}.brand{display:grid;place-items:center;width:46px;height:46px;border-radius:15px;color:#102014;background:linear-gradient(145deg,var(--lime),var(--mint));font-size:18px;font-weight:900;box-shadow:0 12px 30px rgba(87,229,168,.2)}.rail-links{display:grid;gap:12px;margin-top:38px}.rail-link{display:grid;place-items:center;width:44px;height:44px;border:1px solid transparent;border-radius:14px;color:#a9b8b0;text-decoration:none;font-size:20px;transition:.2s}.rail-link:hover,.rail-link.active{color:#07100c;background:var(--ink);transform:translateY(-2px)}.rail-link span{position:absolute;left:70px;padding:7px 10px;border-radius:8px;background:#edfdf4;color:#102014;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transform:translateX(-4px);transition:.2s}.rail-link:hover span{opacity:1;transform:none}
.wrap{grid-column:2;width:calc(100% - 48px);max-width:1380px;margin:0 auto;padding:32px 0 64px;min-width:0}.top,.row{display:flex;gap:12px;align-items:center;justify-content:space-between}.top{margin-bottom:22px}.eyebrow{margin:0 0 5px;color:var(--lime);font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1,h2{margin:0;letter-spacing:-.035em}h1{font-size:clamp(30px,4vw,48px);line-height:1}h2{font-size:20px}.status-dot{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:#c9d8d0;font-size:13px;background:rgba(255,255,255,.035)}.status-dot:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 14px var(--mint)}
#content{min-height:360px}.card{background:linear-gradient(145deg,var(--glass-2),var(--glass));border:1px solid var(--line);border-radius:24px;padding:22px;margin:14px 0;box-shadow:var(--shadow);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}#content.card{padding:10px;background:rgba(9,22,16,.52);overflow:hidden}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid>.card{min-height:112px;margin:0;display:flex;flex-direction:column;justify-content:space-between;box-shadow:none;position:relative;overflow:hidden}.grid>.card:after{content:"";position:absolute;width:74px;height:74px;right:-28px;bottom:-32px;border-radius:50%;background:var(--mint);opacity:.08}.grid>.card:nth-child(3n):after{background:var(--amber)}.metric{font-size:clamp(25px,3vw,37px);font-weight:820;letter-spacing:-.045em;margin-top:10px}.muted{color:var(--muted)}
.agent-ready #content>div{display:none}.agent-ready[data-view="overview"] #content>div:nth-child(1),.agent-ready[data-view="overview"] #content>div:nth-child(2),.agent-ready[data-view="overview"] #content>div:nth-child(3),.agent-ready[data-view="clients"] #content>div:nth-child(4),.agent-ready[data-view="commissions"] #content>div:nth-child(5),.agent-ready[data-view="payouts"] #content>div:nth-child(3),.agent-ready[data-view="payouts"] #content>div:nth-child(6){display:block}.agent-ready #content{min-height:0}.agent-ready #content>div:nth-child(n+4){max-height:calc(100vh - 190px);overflow:auto}.agent-ready .rail-link.active{color:#07100c;background:var(--ink)}
@media(min-width:701px){body.agent-ready{height:auto;overflow-y:auto}.agent-ready .wrap{min-height:100vh;padding:18px 0}.agent-ready .top{margin-bottom:10px}.agent-ready h1{font-size:36px}.agent-ready #content.card{padding:7px}.agent-ready #content>.card{padding:14px;margin:7px 0}.agent-ready #content>.card:first-child h2{font-size:17px;margin-bottom:8px}.agent-ready #content>.grid{gap:7px}.agent-ready .grid>.card{min-height:82px;padding:12px}.agent-ready .grid .metric{font-size:25px;margin-top:4px}.agent-ready #content>div:nth-child(3) h2{font-size:16px}.agent-ready #content>div:nth-child(3) .muted{font-size:12px}}
@media(min-width:1200px){.agent-ready[data-view="overview"] #content>.grid{grid-template-columns:repeat(7,minmax(0,140px));justify-content:space-between}.agent-ready[data-view="overview"] .grid>.card{min-height:68px;padding:10px 12px;border-radius:16px}.agent-ready[data-view="overview"] .grid .muted{font-size:12px;line-height:1.2}.agent-ready[data-view="overview"] .grid .metric{font-size:20px;line-height:1.05;margin-top:6px}}
.agent-profile{display:flex;align-items:center;gap:12px;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}.agent-avatar{width:56px;height:56px;flex:0 0 56px;border-radius:17px;object-fit:cover;background:linear-gradient(145deg,var(--lime),var(--mint));color:#0a1d12;display:grid;place-items:center;font-size:20px;font-weight:900}.agent-profile-copy{min-width:0;flex:1}.agent-profile-name{font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.agent-profile-meta{color:var(--muted);font-size:13px}.profile-edit{min-height:36px;padding:7px 11px;font-size:13px}.profile-modal{position:fixed;inset:0;z-index:20;display:none;place-items:center;padding:18px;background:rgba(0,8,4,.74);backdrop-filter:blur(12px)}.profile-modal.open{display:grid}.profile-panel{width:min(620px,100%);max-height:90vh;overflow:auto;padding:24px;border:1px solid var(--line);border-radius:24px;background:#10251e;box-shadow:var(--shadow)}.profile-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.profile-preview{width:88px;height:88px;border-radius:22px;object-fit:cover;background:#18382b;margin-bottom:14px}.profile-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.profile-fields .wide{grid-column:1/-1}.profile-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.profile-message{min-height:20px;margin:8px 0 0;color:var(--muted);font-size:13px}
.brand{cursor:pointer;text-decoration:none;overflow:hidden;background:#020807}.brand img{width:100%;height:100%;object-fit:contain}.agent-photo-actions{display:grid;justify-items:center;gap:5px;flex:0 0 64px}.agent-photo-button{display:block;padding:0;min-height:0;border:0;border-radius:17px;background:transparent}.agent-photo-button:hover{transform:scale(1.04)}.agent-profile-copy{margin-left:8px}.profile-edit{min-height:27px;padding:3px 7px;font-size:11px;white-space:nowrap;border-radius:8px}
label{display:grid;gap:7px;color:#c9d9d0;font-size:14px}input,select,textarea,button{min-height:44px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);font:inherit}input,select,textarea{background:rgba(1,8,5,.62);color:white;width:100%;outline:none}textarea{resize:vertical;min-height:88px}input:focus,select:focus,textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(87,229,168,.12)}button{background:linear-gradient(135deg,var(--lime),var(--mint));color:#0a1d12;font-weight:800;cursor:pointer;transition:transform .18s,filter .18s}button:hover{transform:translateY(-2px);filter:brightness(1.05)}button.secondary{background:rgba(255,255,255,.055);color:#effff7}button:disabled{opacity:.45;cursor:not-allowed;transform:none}.form-actions{margin-top:18px}
table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:14px 12px;text-align:left;border-bottom:1px solid rgba(214,255,230,.1)}th{color:#91a99d;font-size:12px;letter-spacing:.08em;text-transform:uppercase}td{color:#dbeae2}.pill{display:inline-flex;padding:5px 10px;border-radius:99px;background:rgba(87,229,168,.1);color:#85f1be;border:1px solid rgba(87,229,168,.15);font-size:12px}.empty{padding:34px;text-align:center;color:var(--muted)}.qr{width:180px;height:180px;background:white;padding:9px;border-radius:16px;display:none;margin-top:14px}.referral-hero{position:relative;overflow:hidden;padding:28px}.referral-hero:after{content:"";position:absolute;width:320px;height:320px;right:-110px;top:-190px;border-radius:50%;background:radial-gradient(circle,rgba(201,246,91,.2),transparent 70%);pointer-events:none}.referral-hero h2{font-size:25px;margin-bottom:16px}.section-card>h2{margin-bottom:14px}.page-back{min-width:92px}
@media(max-width:980px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.app-shell{display:block}.rail{position:sticky;top:0;width:100%;height:68px;inset:auto;flex-direction:row;justify-content:space-between;padding:10px 16px;border-right:0;border-bottom:1px solid var(--line)}.rail-links{display:flex;margin:0;gap:6px}.rail-link{width:40px;height:40px}.rail-link span{display:none}.wrap{width:calc(100% - 28px);padding-top:24px}.top{align-items:flex-start}.row{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}.grid>.card{min-height:104px}.card{padding:17px;border-radius:19px}h1{font-size:31px}.status-dot{display:none}.page-back{min-width:auto}}
</style></head>
<body data-view="overview"><div class="app-shell"><aside class="rail" aria-label="Marketing Agent navigation"><div class="brand" aria-label="MB Future Tech">MB</div><nav class="rail-links"><a class="rail-link active" href="#overview" data-view-link="overview" aria-label="Overview">⌂<span>Overview</span></a><a class="rail-link" href="#clients" data-view-link="clients" aria-label="My clients">◎<span>My clients</span></a><a class="rail-link" href="#commissions" data-view-link="commissions" aria-label="Commissions">◫<span>Commissions</span></a><a class="rail-link" href="#payouts" data-view-link="payouts" aria-label="Payouts">◇<span>Payouts</span></a></nav></aside><main class="wrap"><div class="top"><div><p class="eyebrow">Partner workspace</p><h1>Marketing Agent</h1><div class="muted">Clients, commissions, and payouts in one place.</div></div><div class="row"><span class="status-dot">Secure agent access</span><button class="secondary page-back" onclick="location.href='/'">Back</button></div></div><div id="content" class="card">Loading…</div></main></div>
<script>
const token=localStorage.getItem('aura_token');const money=n=>'₱'+((n||0)/100).toFixed(2);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token};if(opt.body&&!(opt.body instanceof FormData))opt.headers['Content-Type']='application/json';const r=await fetch(path,opt),d=(r.headers.get('content-type')||'').includes('json')?await r.json():{};if(!r.ok)throw Error(d.detail||'Request failed');if(path==='/referral-agent/me')window.agentDashboard=d;return d}
function applicationForm(agent){return `<h2>Become a Marketing Agent</h2><p class="muted">Submit your identity and payout details for verification. Your referral link activates only after approval.</p><form id="agentForm"><div class="grid"><label>Full name<input name="full_name" required value="${esc(agent?.full_name||'')}"></label><label>Email<input name="email" type="email" required value="${esc(agent?.application_email||'')}"></label><label>Mobile number<input name="mobile_number" required value="${esc(agent?.mobile_number||'')}"></label><label>Address / location<input name="address_location" required value="${esc(agent?.address_location||'')}"></label><label>ID type<select name="id_type" required><option>National ID</option><option>Driver License</option><option>Passport</option><option>Other Government ID</option></select></label><label>ID/reference number (optional)<input name="id_reference"></label><label>ID document<input name="identity_document" type="file" accept="image/jpeg,image/png,application/pdf" required></label><label>Payout method<select name="payout_method" id="payoutMethod" onchange="bankField.hidden=this.value!=='bank_transfer'" required><option value="gcash">GCash</option><option value="maya">Maya</option><option value="bank_transfer">Bank Transfer</option></select></label><label>Account holder name<input name="account_holder_name" required></label><label>Account/mobile number<input name="account_number" required></label><label id="bankField" hidden>Bank name<input name="bank_name"></label></div><div class="form-actions"><button type="submit">Submit for verification</button></div><p id="formMessage" class="muted"></p></form>`}
async function submitApplication(e){e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{await api('/referral-agent/application',{method:'POST',body:new FormData(e.target)});await load()}catch(err){formMessage.textContent=err.message;button.disabled=false}}
function copyLink(){navigator.clipboard.writeText(refLink.value);copied.textContent='Copied'}async function toggleQr(){if(!qr.dataset.loaded){const response=await fetch('/referral-agent/qr',{headers:{Authorization:'Bearer '+token}});if(!response.ok){alert('Unable to load QR code.');return}qr.src=URL.createObjectURL(await response.blob());qr.dataset.loaded='1'}qr.style.display=qr.style.display==='block'?'none':'block'}async function shareLink(){if(navigator.share)await navigator.share({title:'MB Future Tech',text:'Join MB Future Tech',url:refLink.value});else copyLink()}
async function requestPayout(){try{await api('/referral-agent/payout-request',{method:'POST'});await load()}catch(e){alert(e.message)}}
async function load(){if(!token){location.href='/login';return}try{const d=await api('/referral-agent/me');if(!d.agent||['draft','pending'].includes(d.agent.status)){content.innerHTML=applicationForm(d.agent);agentForm.addEventListener('submit',submitApplication);return}if(d.agent.status==='pending_verification'){content.innerHTML='<h2>Pending Verification</h2><p class="muted">Your application was submitted and is waiting for Owner review.</p>';return}if(d.agent.status==='rejected'){content.innerHTML='<h2>Application Rejected</h2><p class="muted">You may submit corrected information for another review.</p>'+applicationForm(d.agent);agentForm.addEventListener('submit',submitApplication);return}if(d.agent.status==='suspended'){content.innerHTML='<h2>Account Suspended</h2><p class="muted">Your referral link cannot create qualifying new referrals.</p>';return}const p=d.pricing,short=Math.max(0,p.minimum_payout_minor-d.available_minor);content.innerHTML=`<div class="card"><h2>Your referral link</h2><div class="row"><input id="refLink" readonly value="${esc(d.referral_link)}"><button onclick="copyLink()">Copy Link</button><button class="secondary" onclick="toggleQr()">QR Code</button><button class="secondary" onclick="shareLink()">Share</button></div><span id="copied" class="muted"></span><img id="qr" class="qr" src="/referral-agent/qr" alt="Referral QR code"></div><div class="grid"><div class="card"><div class="muted">My Clients</div><div class="metric">${d.clients}</div></div><div class="card"><div class="muted">Active Clients</div><div class="metric">${d.active_clients}</div></div><div class="card"><div class="muted">Pending Earnings</div><div class="metric">${money(d.pending_minor)}</div></div><div class="card"><div class="muted">Available Earnings</div><div class="metric">${money(d.available_minor)}</div></div><div class="card"><div class="muted">Payout Requested</div><div class="metric">${money(d.payout_requested_minor)}</div></div><div class="card"><div class="muted">Total Paid</div><div class="metric">${money(d.paid_minor)}</div></div><div class="card"><div class="muted">Lifetime Earnings</div><div class="metric">${money(d.pending_minor+d.available_minor+d.payout_requested_minor+d.paid_minor)}</div></div></div><div class="card"><div class="row"><div><h2>Request payout</h2><div class="muted">Policy: ${esc(p.payout_schedule.replaceAll('_',' '))} · Minimum ${money(p.minimum_payout_minor)}</div></div><button onclick="requestPayout()" ${short?'disabled':''}>Request Payout</button></div>${short?`<p class="muted">You need ${money(short)} more available earnings.</p>`:''}</div><div class="card"><h2>My Clients</h2><div style="overflow:auto"><table><thead><tr><th>Business</th><th>Signup</th><th>Subscription</th><th>Last payment</th><th>Total commission</th></tr></thead><tbody>${d.referred_customers.map(x=>`<tr><td>${esc(x.company_name)}</td><td>${esc(x.attributed_at)}</td><td>${esc(x.status)}</td><td>${esc(x.last_qualifying_payment||'—')}</td><td>${money(x.total_commission_minor)}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No clients yet.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Commission history</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Type</th><th>Commission</th><th>Status</th></tr></thead><tbody>${d.commissions.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.entry_type)}</td><td>${money(x.commission_amount_minor)}</td><td><span class="pill">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No commissions yet.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Payout history</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Amount</th><th>Method</th><th>Destination</th><th>Status</th><th>Reference</th></tr></thead><tbody>${d.payouts.map(x=>`<tr><td>${esc(x.requested_at||x.created_at)}</td><td>${money(x.amount_minor)}</td><td>${esc(x.payout_method_snapshot)}</td><td>${esc(x.destination_masked)}</td><td>${esc(x.status)}</td><td>${esc(x.payment_reference||'—')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No payouts yet.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Notifications</h2>${d.notifications.map(n=>`<p><strong>${esc(n.title)}</strong><br><span class="muted">${esc(n.message)} · ${esc(n.created_at)}</span></p>`).join('')||'<p class="muted">No notifications yet.</p>'}</div>`}catch(e){content.textContent=e.message}}
const brand=document.querySelector('.brand');brand.innerHTML='<img src="/static/mb-future-tech-logo.png" alt="MB Future Tech">';brand.setAttribute('role','link');brand.setAttribute('tabindex','0');brand.setAttribute('aria-label','Back to home');brand.onclick=()=>location.href='/';brand.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();location.href='/'}};
const validViews=new Set(['overview','clients','commissions','payouts']);
function setView(){const requested=location.hash.slice(1),view=validViews.has(requested)?requested:'overview';document.body.dataset.view=view;document.querySelectorAll('[data-view-link]').forEach(link=>link.classList.toggle('active',link.dataset.viewLink===view));window.scrollTo({top:0,behavior:'instant'})}
function profilePhotoUrl(){return 'data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs='}
async function hydrateProfilePhotos(root=document){const images=root.querySelectorAll('img.agent-avatar:not([data-loaded]),img.profile-preview:not([data-loaded])');if(!images.length)return;images.forEach(img=>img.dataset.loaded='loading');const response=await fetch('/referral-agent/profile-photo',{headers:{Authorization:'Bearer '+token}});if(!response.ok){images.forEach(img=>delete img.dataset.loaded);return}const url=URL.createObjectURL(await response.blob());images.forEach(img=>{img.src=url;img.dataset.loaded='1'})}
function mountAgentProfile(){const a=window.agentDashboard?.agent,card=content.firstElementChild;if(!a||!card||card.querySelector('.agent-profile'))return;const initials=(a.full_name||'Agent').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();const avatar=a.has_profile_photo?`<img class="agent-avatar" src="${profilePhotoUrl()}" alt="${esc(a.full_name)} profile picture">`:`<span class="agent-avatar" aria-hidden="true">${esc(initials)}</span>`;card.insertAdjacentHTML('afterbegin',`<div class="agent-profile"><div class="agent-photo-actions"><button class="agent-photo-button" onclick="openPhotoEditor()" aria-label="Change profile picture">${avatar}</button><button class="secondary profile-edit" onclick="openProfile()">Edit Profile</button></div><div class="agent-profile-copy"><div class="agent-profile-name">${esc(a.full_name||'Marketing Agent')}</div><div class="agent-profile-meta">${esc(a.profile_bio||a.address_location||'Approved marketing partner')}</div></div></div>`)}
function openProfile(){const a=window.agentDashboard.agent,modal=document.createElement('div');modal.id='profileModal';modal.className='profile-modal open';modal.innerHTML=`<form class="profile-panel" id="profileForm"><div class="profile-panel-head"><div><p class="eyebrow">Agent details</p><h2>Edit Profile</h2></div><button type="button" class="secondary" onclick="closeProfile()" aria-label="Close">Close</button></div><div class="profile-fields"><label>Full name<input name="full_name" required maxlength="100" value="${esc(a.full_name||'')}"></label><label>Mobile number<input name="mobile_number" maxlength="40" value="${esc(a.mobile_number||'')}"></label><label>Location<input name="address_location" maxlength="180" value="${esc(a.address_location||'')}"></label><label class="wide">Short introduction<textarea name="profile_bio" maxlength="280" placeholder="Tell customers a little about you">${esc(a.profile_bio||'')}</textarea></label></div><p class="profile-message" id="profileMessage"></p><div class="profile-actions"><button type="button" class="secondary" onclick="closeProfile()">Cancel</button><button type="submit">Save Details</button></div></form>`;document.body.appendChild(modal);profileForm.addEventListener('submit',saveProfile)}
function openPhotoEditor(){const a=window.agentDashboard.agent,modal=document.createElement('div');modal.id='profileModal';modal.className='profile-modal open';modal.innerHTML=`<form class="profile-panel" id="profileForm"><div class="profile-panel-head"><div><p class="eyebrow">Agent photo</p><h2>Change Picture</h2></div><button type="button" class="secondary" onclick="closeProfile()">Close</button></div>${a.has_profile_photo?`<img class="profile-preview" src="${profilePhotoUrl()}" alt="Current profile picture">`:''}<input type="hidden" name="full_name" value="${esc(a.full_name||'')}"><input type="hidden" name="mobile_number" value="${esc(a.mobile_number||'')}"><input type="hidden" name="address_location" value="${esc(a.address_location||'')}"><input type="hidden" name="profile_bio" value="${esc(a.profile_bio||'')}"><label>Select new profile picture<input name="profile_picture" type="file" accept="image/jpeg,image/png,image/webp" required></label><p class="profile-message" id="profileMessage">JPG, PNG, or WebP · Maximum 3 MB</p><div class="profile-actions"><button type="button" class="secondary" onclick="closeProfile()">Cancel</button><button type="submit">Save Picture</button></div></form>`;document.body.appendChild(modal);profileForm.addEventListener('submit',saveProfile)}
function closeProfile(){document.getElementById('profileModal')?.remove()}
async function saveProfile(e){e.preventDefault();const button=e.target.querySelector('button[type="submit"]');button.disabled=true;try{await api('/referral-agent/profile',{method:'POST',body:new FormData(e.target)});closeProfile();await load()}catch(err){profileMessage.textContent=err.message;button.disabled=false}}
new MutationObserver(()=>hydrateProfilePhotos()).observe(document.body,{childList:true,subtree:true});
new MutationObserver(()=>{if(content.querySelector('#refLink')){document.body.classList.add('agent-ready');mountAgentProfile();hydrateProfilePhotos(content);setView()}else document.body.classList.remove('agent-ready')}).observe(content,{childList:true});
addEventListener('hashchange',setView);setView();load();
</script></body></html>
