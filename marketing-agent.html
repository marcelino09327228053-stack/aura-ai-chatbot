<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Agent — MB Future Tech</title>
<style>*{box-sizing:border-box}body{margin:0;background:#07120f;color:#effff8;font:15px Arial}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:#10251e;border:1px solid #285844;border-radius:16px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.metric{font-size:27px;font-weight:800;margin-top:5px}.muted{color:#9cc5b3}.link{display:flex;gap:8px}.link input{flex:1}button,input{padding:11px;border-radius:9px;border:1px solid #356b55}button{background:#45d49a;color:#062218;font-weight:bold;cursor:pointer}input{background:#071510;color:white}table{width:100%;border-collapse:collapse}th,td{padding:10px;text-align:left;border-bottom:1px solid #285844}.pill{padding:5px 9px;border-radius:99px;background:#15382b;color:#7bf0bc}.empty{padding:24px;text-align:center;color:#9cc5b3}</style></head>
<body><main class="wrap"><div class="top"><div><h1>Marketing Agent</h1><div class="muted">Refer customers and track your commissions.</div></div><button onclick="location.href='/'">Back</button></div><div id="content" class="card">Loading…</div></main>
<script>const token=localStorage.getItem('aura_token');const money=n=>'₱'+((n||0)/100).toFixed(2);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+token,'Content-Type':'application/json'};const r=await fetch(path,opt),d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');return d}async function apply(){await api('/referral-agent/apply',{method:'POST'});load()}function copyLink(){navigator.clipboard.writeText(document.getElementById('refLink').value);document.getElementById('copied').textContent='Copied'}async function load(){if(!token){location.href='/login';return}try{const d=await api('/referral-agent/me');if(!d.agent){content.innerHTML='<h2>Become a Marketing Agent</h2><p class="muted">Apply to receive your own referral link after Owner approval.</p><button onclick="apply()">Apply now</button>';return}if(d.agent.status!=='approved'){content.innerHTML=`<h2>Application ${esc(d.agent.status)}</h2><p class="muted">Your application must be approved before a referral link becomes active.</p>`;return}content.innerHTML=`<div class="card"><h2>Your referral link</h2><div class="link"><input id="refLink" readonly value="${esc(d.referral_link)}"><button onclick="copyLink()">Copy Link</button></div><div id="copied" class="muted"></div><p class="muted">QR/share-ready link. First valid referral attribution is permanent.</p></div><div class="grid"><div class="card"><div class="muted">Referred clients</div><div class="metric">${d.clients}</div></div><div class="card"><div class="muted">Active clients</div><div class="metric">${d.active_clients}</div></div><div class="card"><div class="muted">Pending</div><div class="metric">${money(d.pending_minor)}</div></div><div class="card"><div class="muted">Available</div><div class="metric">${money(d.available_minor)}</div></div><div class="card"><div class="muted">Paid</div><div class="metric">${money(d.paid_minor)}</div></div></div><div class="card"><h2>Commission history</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Type</th><th>Commission</th><th>Status</th></tr></thead><tbody>${d.commissions.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.entry_type)}</td><td>${money(x.commission_amount_minor)}</td><td><span class="pill">${esc(x.status)}</span></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No commissions yet.</td></tr>'}</tbody></table></div></div><div class="card"><h2>Payout history</h2><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Amount</th><th>Status</th><th>Reference</th></tr></thead><tbody>${d.payouts.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${money(x.amount_minor)}</td><td>${esc(x.status)}</td><td>${esc(x.payment_reference||'—')}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No payouts yet.</td></tr>'}</tbody></table></div></div>`}catch(e){content.textContent=e.message}}load();</script></body></html>
