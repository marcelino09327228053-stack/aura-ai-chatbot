services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      AURA_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://aura:aura@database:5432/aura
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      SECRET_KEY: change-me-in-production
      AGENTS_ENABLED: "true"
      PLUGINS_ENABLED: "true"
    depends_on:
      - database
      - redis
    volumes:
      - backup_data:/app/app/infrastructure/backups/storage
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./register.html:/usr/share/nginx/html/register.html:ro
      - ./dashboard.html:/usr/share/nginx/html/dashboard.html:ro
      - ./subscription.html:/usr/share/nginx/html/subscription.html:ro
      - ./plugins.html:/usr/share/nginx/html/plugins.html:ro
      - ./infrastructure.html:/usr/share/nginx/html/infrastructure.html:ro
      - ./portal.html:/usr/share/nginx/html/portal.html:ro
      - ./os.html:/usr/share/nginx/html/os.html:ro
      - ./network.html:/usr/share/nginx/html/network.html:ro
      - ./intelligence.html:/usr/share/nginx/html/intelligence.html:ro
      - ./global.html:/usr/share/nginx/html/global.html:ro
      - ./enterprise.html:/usr/share/nginx/html/enterprise.html:ro
      - ./corporation.html:/usr/share/nginx/html/corporation.html:ro
      - ./economy.html:/usr/share/nginx/html/economy.html:ro
      - ./commerce.html:/usr/share/nginx/html/commerce.html:ro
      - ./ecosystem.html:/usr/share/nginx/html/ecosystem.html:ro
      - ./universe.html:/usr/share/nginx/html/universe.html:ro
      - ./civilization.html:/usr/share/nginx/html/civilization.html:ro
      - ./app/infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pg_data:
  backup_data:
