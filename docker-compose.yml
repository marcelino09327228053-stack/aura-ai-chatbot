services:
  backend:
    build: .
    ports:
      - "8000:8000"
    environment:
      AURA_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://aura:aura@database:5432/aura
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET}
      PAYMENT_WEBHOOK_PROVIDER: ${PAYMENT_WEBHOOK_PROVIDER:?Set PAYMENT_WEBHOOK_PROVIDER}
      AI_METRICS_BEARER_TOKEN: ${AI_METRICS_BEARER_TOKEN:?Set AI_METRICS_BEARER_TOKEN}
      CLOUD_ENCRYPTION_KEY: ${CLOUD_ENCRYPTION_KEY:?Set CLOUD_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      FORCE_HTTPS: "true"
      AGENTS_ENABLED: "true"
      PLUGINS_ENABLED: "true"
    depends_on:
      - database
      - redis
    volumes:
      - backup_data:/app/app/infrastructure/backups/storage
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./register.html:/usr/share/nginx/html/register.html:ro
      - ./dashboard.html:/usr/share/nginx/html/dashboard.html:ro
      - ./subscription.html:/usr/share/nginx/html/subscription.html:ro
      - ./plugins.html:/usr/share/nginx/html/plugins.html:ro
      - ./infrastructure.html:/usr/share/nginx/html/infrastructure.html:ro
      - ./portal.html:/usr/share/nginx/html/portal.html:ro
      - ./os.html:/usr/share/nginx/html/os.html:ro
      - ./network.html:/usr/share/nginx/html/network.html:ro
      - ./intelligence.html:/usr/share/nginx/html/intelligence.html:ro
      - ./global.html:/usr/share/nginx/html/global.html:ro
      - ./enterprise.html:/usr/share/nginx/html/enterprise.html:ro
      - ./corporation.html:/usr/share/nginx/html/corporation.html:ro
      - ./economy.html:/usr/share/nginx/html/economy.html:ro
      - ./commerce.html:/usr/share/nginx/html/commerce.html:ro
      - ./ecosystem.html:/usr/share/nginx/html/ecosystem.html:ro
      - ./universe.html:/usr/share/nginx/html/universe.html:ro
      - ./civilization.html:/usr/share/nginx/html/civilization.html:ro
      - ./app/infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  owner-console:
    build: .
    command: ["python", "-m", "uvicorn", "owner_main:app", "--host", "0.0.0.0", "--port", "9000", "--proxy-headers"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      AURA_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: postgresql://aura:aura@database:5432/aura
      OWNER_CONSOLE_SECRET: ${OWNER_CONSOLE_SECRET:?Set OWNER_CONSOLE_SECRET}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?Set OWNER_PASSWORD_HASH}
      OWNER_TOTP_SECRET: ${OWNER_TOTP_SECRET:?Set OWNER_TOTP_SECRET}
      OWNER_COOKIE_SECURE: "true"
      OWNER_ALLOWED_NETWORKS: ${OWNER_ALLOWED_NETWORKS:-127.0.0.0/8,172.16.0.0/12,100.64.0.0/10}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CLOUD_ENCRYPTION_KEY: ${CLOUD_ENCRYPTION_KEY:?Set CLOUD_ENCRYPTION_KEY}
    depends_on:
      - database
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: aura
      POSTGRES_DB: aura
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pg_data:
  backup_data:
