services:
  backend:
    build: .
    command: ["python", "-m", "uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips=*"]
    expose:
      - "8000"
    environment:
      AURA_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL}
      REDIS_ENABLED: "true"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?Set PAYMENT_WEBHOOK_SECRET}
      PAYMENT_WEBHOOK_PROVIDER: ${PAYMENT_WEBHOOK_PROVIDER:?Set PAYMENT_WEBHOOK_PROVIDER}
      AI_METRICS_BEARER_TOKEN: ${AI_METRICS_BEARER_TOKEN:?Set AI_METRICS_BEARER_TOKEN}
      CLOUD_ENCRYPTION_KEY: ${CLOUD_ENCRYPTION_KEY:?Set CLOUD_ENCRYPTION_KEY}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?Set ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set CORS_ALLOWED_ORIGINS}
      FORCE_HTTPS: "true"
      MOCK_PAYMENTS_ENABLED: "false"
      AGENTS_ENABLED: "true"
      PLUGINS_ENABLED: "true"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backup_data:/app/app/infrastructure/backups/storage
      - private_data:/app/.private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/health',headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./app/infrastructure/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  edge:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN}
    volumes:
      - ./app/infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    restart: unless-stopped

  owner-console:
    build: .
    command: ["python", "-m", "uvicorn", "owner_main:app", "--host", "0.0.0.0", "--port", "9000", "--proxy-headers"]
    ports:
      - "127.0.0.1:9000:9000"
    environment:
      AURA_ENV: production
      DB_BACKEND: postgres
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      OWNER_CONSOLE_SECRET: ${OWNER_CONSOLE_SECRET:?Set OWNER_CONSOLE_SECRET}
      OWNER_EMAIL: ${OWNER_EMAIL:?Set OWNER_EMAIL}
      OWNER_PASSWORD_HASH: ${OWNER_PASSWORD_HASH:?Set OWNER_PASSWORD_HASH}
      OWNER_TOTP_SECRET: ${OWNER_TOTP_SECRET:?Set OWNER_TOTP_SECRET}
      OWNER_MFA_REQUIRED: "true"
      OWNER_COOKIE_SECURE: "true"
      OWNER_ALLOWED_NETWORKS: ${OWNER_ALLOWED_NETWORKS:-127.0.0.0/8,172.16.0.0/12,100.64.0.0/10}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      CLOUD_ENCRYPTION_KEY: ${CLOUD_ENCRYPTION_KEY:?Set CLOUD_ENCRYPTION_KEY}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - private_data:/app/.private:ro
    restart: unless-stopped

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: aura
    expose:
      - "5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura -d aura"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    restart: unless-stopped

  database-backup:
    image: postgres:16-alpine
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    command:
      - /bin/sh
      - -ec
      - |
        while true; do
          pg_dump "$$DATABASE_URL" --format=custom --file="/backups/postgres_daily_$$(date -u +%Y%m%d_%H%M%S).dump"
          find /backups -type f -name 'postgres_daily_*.dump' -mtime +"$${BACKUP_RETENTION_DAYS:-14}" -delete
          sleep 86400
        done
    volumes:
      - backup_data:/backups
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  backup_data:
  private_data:
  caddy_data:
  caddy_config:
