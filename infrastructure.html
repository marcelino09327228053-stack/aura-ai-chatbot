<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MB Future Tech — AI Chatbot | Infrastructure</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial; background: #0f172a; color: white; margin: 0; padding: 20px; }
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
button, .btn { padding: 10px 14px; border: none; border-radius: 8px; background: #3b82f6; color: white; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-right: 8px; margin-bottom: 8px; }
.btn-secondary { background: #334155; }
.btn-danger { background: #ef4444; }
.widgets { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.widget { background: #334155; border-radius: 8px; padding: 16px; text-align: center; }
.widget-value { font-size: 22px; font-weight: bold; margin-top: 8px; }
.item { background: #334155; border-radius: 8px; padding: 12px; margin-bottom: 8px; font-size: 13px; }
</style>
<script src="/static/aura-notifications.js"></script>
</head>
<body>
<div class="header">
  <h1>🏗️ Enterprise Infrastructure</h1>
  <div>
    <a href="/dashboard" class="btn btn-secondary">Dashboard</a>
    <a href="/plugins" class="btn btn-secondary">Plugins</a>
    <button class="btn-danger" onclick="logout()">Logout</button>
  </div>
</div>

<div class="card">
  <h2 style="margin-top:0;">System Status</h2>
  <div id="statusInfo" style="color:#94a3b8;">Loading...</div>
  <div class="widgets" id="metricGrid"></div>
</div>

<div class="card">
  <h2 style="margin-top:0;">Backups</h2>
  <button onclick="runBackup('daily')">Daily Backup</button>
  <button onclick="runBackup('weekly')" class="btn-secondary">Weekly Backup</button>
  <div id="backupList" style="margin-top:12px;"></div>
</div>

<div class="card">
  <h2 style="margin-top:0;">Team</h2>
  <input id="inviteEmail" placeholder="user@email.com">
  <select id="inviteRole">
    <option value="member">Member</option>
    <option value="admin">Admin</option>
    <option value="viewer">Viewer</option>
  </select>
  <button onclick="inviteMember()">Invite</button>
  <div id="teamList" style="margin-top:12px;"></div>
</div>

<div class="card">
  <h2 style="margin-top:0;">Audit & Activity</h2>
  <div id="auditList"></div>
</div>

<div class="card">
  <h2 style="margin-top:0;">Error Logs</h2>
  <div id="errorList" style="max-height:200px; overflow-y:auto;"></div>
</div>

<script>
function authHeaders() {
  const token = localStorage.getItem("aura_token");
  if (!token) { window.location.href = "/login"; return null; }
  return { "Content-Type": "application/json", "Authorization": "Bearer " + token };
}

function escapeHtml(t) {
  return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function logout() {
  localStorage.removeItem("aura_token");
  window.location.href = "/login";
}

async function loadAll() {
  const headers = authHeaders();
  if (!headers) return;

  const [statusRes, teamRes, auditRes, backupRes, errRes] = await Promise.all([
    fetch("/api/infrastructure/status", { headers }),
    fetch("/api/infrastructure/team", { headers }),
    fetch("/api/infrastructure/audit", { headers }),
    fetch("/api/infrastructure/backups", { headers }),
    fetch("/api/infrastructure/monitoring/errors", { headers })
  ]);

  if (statusRes.ok) {
    const s = await statusRes.json();
    document.getElementById("statusInfo").textContent =
      "Env: " + s.environment + " | DB: " + s.database + " | Redis: " + (s.redis ? "ON" : "OFF");
    const m = s.metrics;
    document.getElementById("metricGrid").innerHTML = `
      <div class="widget"><div style="color:#94a3b8;font-size:13px;">CPU</div><div class="widget-value">${m.cpu_percent}%</div></div>
      <div class="widget"><div style="color:#94a3b8;font-size:13px;">Memory</div><div class="widget-value">${m.memory.percent}%</div></div>
      <div class="widget"><div style="color:#94a3b8;font-size:13px;">Requests</div><div class="widget-value">${m.api_usage.total_requests}</div></div>
      <div class="widget"><div style="color:#94a3b8;font-size:13px;">Errors</div><div class="widget-value">${m.error_count}</div></div>
    `;
  }

  if (teamRes.ok) {
    const t = await teamRes.json();
    document.getElementById("teamList").innerHTML = t.members.map(function(m) {
      return `<div class="item">User #${m.user_id} — <strong>${escapeHtml(m.role)}</strong></div>`;
    }).join("") || "<p style='color:#94a3b8;'>No team members.</p>";
  }

  if (auditRes.ok) {
    const logs = await auditRes.json();
    document.getElementById("auditList").innerHTML = logs.slice(0, 15).map(function(l) {
      return `<div class="item">${escapeHtml(l.action)} <span style="color:#64748b;">${escapeHtml(l.created_at)}</span></div>`;
    }).join("") || "<p style='color:#94a3b8;'>No audit logs.</p>";
  }

  if (backupRes.ok) {
    const backups = await backupRes.json();
    document.getElementById("backupList").innerHTML = backups.map(function(b) {
      return `<div class="item">${escapeHtml(b.name)} (${b.size_bytes} bytes)</div>`;
    }).join("") || "<p style='color:#94a3b8;'>No backups yet.</p>";
  }

  if (errRes.ok) {
    const e = await errRes.json();
    const lines = (e.file_logs || []).concat(e.buffer || []);
    document.getElementById("errorList").innerHTML = lines.slice(-15).map(function(l) {
      const text = l.line || (l.message + " " + (l.path || ""));
      return `<div class="item">${escapeHtml(text)}</div>`;
    }).join("") || "<p style='color:#94a3b8;'>No errors.</p>";
  }
}

async function runBackup(kind) {
  const headers = authHeaders();
  if (!headers) return;
  const url = kind === "weekly" ? "/api/infrastructure/backups/weekly" : "/api/infrastructure/backups/daily";
  const res = await fetch(url, { method: "POST", headers });
  const data = await res.json();
  showToast(data.ok ? "Backup created: " + data.path : "Backup failed: " + (data.error || "unknown"));
  loadAll();
}

async function inviteMember() {
  const headers = authHeaders();
  if (!headers) return;
  const email = document.getElementById("inviteEmail").value.trim();
  const role = document.getElementById("inviteRole").value;
  const res = await fetch("/api/infrastructure/team/invite", {
    method: "POST", headers, body: JSON.stringify({ email, role })
  });
  const data = await res.json();
  if (!res.ok) { showToast(data.detail || "Invite failed."); return; }
  document.getElementById("inviteEmail").value = "";
  loadAll();
}

loadAll();
</script>
</body>
</html>
